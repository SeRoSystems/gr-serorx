id: serorx_modes_slicer
label: Mode S PPM Slicer
category: '[SeRo RX]/ADS-B'
flags: [python]

templates:
  imports: from gnuradio.serorx import adsb
  make: adsb.modes_slicer()

inputs:
- domain: message
  id: windows

outputs:
- domain: message
  id: bits
  optional: true
- domain: message
  id: confidence
  optional: true

documentation: |-
  Slices every frame window PDU into 112 bits. bits carries the 14 bytes with the window's metadata
  plus a confidence per bit and the window samples. confidence carries the confidences signed by the
  bit value (+ for 1, - for 0) as a float32 PDU for a QT GUI Time Sink in message mode. A message that
  is not a float32 PDU is dropped with one warning.

file_format: 1
