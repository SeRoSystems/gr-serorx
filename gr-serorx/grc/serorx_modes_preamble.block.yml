id: serorx_modes_preamble
label: Mode S Preamble Detector
category: '[SeRo RX]/ADS-B'
flags: [python]

templates:
  imports: from gnuradio.serorx import adsb
  make: adsb.modes_preamble(samp_rate=${samp_rate}, threshold=${threshold})
  callbacks:
  - set_samp_rate(${samp_rate})

parameters:
- id: samp_rate
  label: Sample rate (Sps)
  dtype: raw
  default: samp_rate
- id: threshold
  label: Preamble pulse/gap ratio
  dtype: raw
  default: 3.0

inputs:
- domain: stream
  dtype: float

outputs:
- domain: message
  id: windows
  optional: true

asserts:
- "${ # Sample rate invalid (missing or not an even number of MSps)\nsamp_rate is not None and round(samp_rate / 1e6) >= 2 and round(samp_rate / 1e6) % 2 == 0 and abs(round(samp_rate / 1e6) * 1e6 - samp_rate) <= 1 }"
- "${ # Preamble pulse/gap ratio invalid (missing or 1 or less)\nthreshold is not None and threshold > 1 }"

documentation: |-
  Detects Mode S preambles on a magnitude stream (Complex to Mag) and publishes one PDU per
  candidate on windows: the 120 us frame window as float32, with offset (sample index), spu, samp_rate
  and, when the stream carries rx_time tags, time (seconds) in the metadata. Feed windows to the
  Mode S PPM Slicer. The sample rate must be an even number of MSps and follows a variable at runtime.

file_format: 1
