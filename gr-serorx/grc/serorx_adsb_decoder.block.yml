id: serorx_adsb_decoder
label: ADS-B Decoder
category: '[SeRo RX]/ADS-B'
flags: [python]

templates:
  imports: from gnuradio.serorx import adsb
  make: adsb.adsb_decoder(samp_rate=${samp_rate}, threshold=${threshold}, print_lines=${print_lines})
  callbacks:
  - set_samp_rate(${samp_rate})

parameters:
- id: samp_rate
  label: Sample rate (Sps)
  dtype: raw
  default: samp_rate
- id: threshold
  label: Preamble pulse/gap ratio
  dtype: raw
  default: 3.0
- id: print_lines
  label: Print to console
  dtype: bool
  default: 'True'
  options: ['True', 'False']
  option_labels: ['Yes', 'No']

inputs:
- domain: stream
  dtype: float

outputs:
- domain: message
  id: frames
  optional: true

asserts:
- "${ # Sample rate invalid (missing or not an even number of MSps)\nsamp_rate is not None and round(samp_rate / 1e6) >= 2 and round(samp_rate / 1e6) % 2 == 0 and abs(round(samp_rate / 1e6) * 1e6 - samp_rate) <= 1 }"
- "${ # Preamble pulse/gap ratio invalid (missing or 1 or less)\nthreshold is not None and threshold > 1 }"

documentation: |-
  ADS-B decoding one block: Mode S Preamble Detector, PPM Slicer, Frame Check (DF 17 and 18,
  single-bit correction) and ADS-B Fields. Takes a magnitude stream (Complex to Mag). Decoded lines
  are printed and published as byte PDUs on the frames port (a QT GUI Message Log shows them as text).
  Each line carries DF, ICAO, type code and the fields of the message: callsign, altitude, latitude
  and longitude (once an even and an odd position message of the aircraft arrived within 10 s), speed,
  track, airspeed, heading, vertical rate. The sample rate must be an even number of MSps and
  follows a variable at runtime.

file_format: 1
