id: serorx_adsb_fields
label: ADS-B Fields
category: '[SeRo RX]/ADS-B'
flags: [python]

templates:
  imports: from gnuradio.serorx import adsb
  make: adsb.adsb_fields(print_lines=${print_lines})

parameters:
- id: print_lines
  label: Print to console
  dtype: bool
  default: 'True'
  options: ['True', 'False']
  option_labels: ['Yes', 'No']

inputs:
- domain: message
  id: frames

outputs:
- domain: message
  id: lines
  optional: true
- domain: message
  id: fields
  optional: true

documentation: |-
  Decodes the frames from Mode S Demod. lines carries one text line per frame as a byte PDU:
  time, downlink format, address, then the fields. DF17 and DF18 add the type code, callsign,
  altitude, latitude and longitude (once an even and an odd position message of the aircraft
  arrived within 10 s), speed, track, airspeed, heading and vertical rate. DF0, 4, 16 and 20 give
  altitude, DF5 and DF21 the squawk, DF11 the capability. fields carries the same as a dict with
  df, icao, frame, score, level, errors and time. Any other message is dropped with one warning.

file_format: 1
