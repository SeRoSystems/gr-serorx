id: serorx_modes_frame_check
label: Mode S Frame Check
category: '[SeRo RX]/ADS-B'
flags: [python]

templates:
  imports: from gnuradio.serorx import adsb
  make: adsb.modes_frame_check(accepted=${accepted}, correct=${correct})

parameters:
- id: accepted
  label: Accepted DFs
  dtype: string
  default: 17,18
- id: correct
  label: Single-bit correction
  dtype: bool
  default: 'True'
  options: ['True', 'False']
  option_labels: ['Yes', 'No']

inputs:
- domain: message
  id: bits

outputs:
- domain: message
  id: frames
  optional: true
- domain: message
  id: hex
  optional: true
- domain: message
  id: windows
  optional: true

documentation: |-
  Passes frames with an accepted downlink format and a valid CRC-24. With the correction on, a frame
  with a bad CRC is retried with its least confident bits flipped one at a time. A frame equal to the
  previous one within a millisecond is dropped. frames carries the 14 bytes with the metadata plus df
  and corrected. hex carries the frame as hex text in a byte PDU for a QT GUI Message Log. windows
  carries the samples of the accepted frame as a float32 PDU for a QT GUI Time Sink in message mode.
  A message that is not a byte PDU is dropped with one warning.

file_format: 1
