name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

env:
  # archive.ubuntu.com is slow from GitHub runners, this is the mirror the runner hosts use.
  APT_MIRROR: http://azure.archive.ubuntu.com/ubuntu/

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v7
      - run: bash ci/apt.sh
      - run: bash ci/test.sh

  version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash ci/check_version.sh "$GITHUB_REF_NAME"
      # A tag without a changelog entry fails here, before anything is built.
      - run: bash ci/changelog.sh "$GITHUB_REF_NAME"

  deb:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v7
      - run: bash ci/apt.sh
      - run: bash ci/deb.sh
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: output/*.deb

  conda:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: bash ci/conda.sh
      - uses: actions/upload-artifact@v7
        with:
          name: conda
          path: output/noarch/*.conda

  windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: conda
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: conda
          path: output/noarch
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: ci/conda-test-env.yml
          init-shell: powershell
      - name: Install the package
        run: micromamba install -y -n ci (Get-ChildItem output/noarch/*.conda).FullName
        shell: pwsh
      - name: QA tests against the installed package
        run: python ci/run_qa.py
        shell: pwsh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The checkout comes first: it cleans the workspace, which would take the artifacts with it.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: output
          merge-multiple: true
      - name: Create the release or add the packages to an existing one
        run: |
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; *) pre= ;; esac
          bash ci/changelog.sh "$GITHUB_REF_NAME" > notes.md
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber output/*.deb output/*.conda
          else
              gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                  --title "gr-serorx $GITHUB_REF_NAME" --notes-file notes.md $pre output/*.deb output/*.conda
          fi
        env:
          GH_TOKEN: ${{ github.token }}
